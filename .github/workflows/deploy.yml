name: Continuous Deployment Pipeline

on:
  push:
    branches: [main, master]

jobs:
  test-and-build-backend:
    name: Backend CI & Container Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: backend
        run: npx prisma generate

      - name: Run Backend Unit & E2E Tests
        working-directory: backend
        run: npm run test && npm run test:e2e

      - name: Compile Backend Production Build
        working-directory: backend
        run: npm run build

  test-and-deploy-frontend:
    name: Frontend Build & Deploy
    needs: [test-and-build-backend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Run Frontend Tests
        working-directory: frontend
        run: flutter test

      - name: Build Web Production SPA
        working-directory: frontend
        run: flutter build web --release

      # Optional Deployment Steps (Activated when secrets configured)
